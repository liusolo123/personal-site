      <section class="case-section case-shell case-overview" aria-labelledby="case-purpose">
        <div>
          <h2 id="case-purpose">把作品放进同一间展厅</h2>
          <p>做这个网站，是希望有一个能持续更新的个人展示空间。项目记录构建与实践，摄影记录观察与感受，两类作品共同组成这个网站。</p>
          <p>设计从“策展空间”展开。首页用同等级的标题、预览和入口介绍两类作品，随后分别进入项目介绍与摄影浏览。</p>
        </div>

            <li>摄影分类、数量提示、空状态和大图浏览。</li>
            <li>手机布局、键盘操作与减少动态效果适配。</li>

            <p>这种结构适合当前阶段逐步补充内容，也方便把背景、作品列表和浏览交互分别调整。</p>

            <div><dt>浏览交互</dt><dd>原生 JavaScript 处理分类与壁纸切换，dialog 承载大图查看器。</dd></div>

      <section class="case-section case-shell" aria-labelledby="case-decisions">

          <div><h3>把交互细节放进实现</h3><p>分类结果与大图使用同一集合，单张照片集合有明确的按钮状态。键盘焦点、滚动恢复和减少动态效果一起纳入浏览流程。</p></div>
        </div>

        </div>

  <script src="js/nav.js"></script>
  <script>
    (function () {
      'use strict';

      var loadingEl = document.getElementById('project-loading');
      var errorEl = document.getElementById('project-error');
      var contentEl = document.getElementById('project-content');

      function showLoading() {
        loadingEl.style.display = '';
        errorEl.style.display = 'none';
        contentEl.style.display = 'none';
      }

      function showError() {
        loadingEl.style.display = 'none';
        errorEl.style.display = '';
        contentEl.style.display = 'none';
      }

      function showContent(project, index) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'none';
        contentEl.style.display = '';

        document.getElementById('project-number').textContent = 'No.' + String(index + 1).padStart(3, '0');
        document.getElementById('project-title').textContent = project.title;
        document.getElementById('project-desc').textContent = project.description;

        var tagsHtml = (project.tags || []).map(function (t) {
          return '<span class="project-card__tag">' + t + '</span>';
        }).join('');
        document.getElementById('project-tags').innerHTML = tagsHtml;

        document.title = project.id === 'personal-site' ? project.title : project.title + ' · 策展空间';

        if (project.id === 'personal-site') {
          contentEl.appendChild(document.getElementById('website-case-template').content.cloneNode(true));
          document.querySelector('meta[name="description"]').content = project.description;
        }

        requestAnimationFrame(function () {
          contentEl.querySelectorAll('.fade-in').forEach(function (el) {
            el.classList.add('visible');
          });
        });
      }

      function init() {
        showLoading();

        var params = new URLSearchParams(window.location.search);
        var projectId = params.get('id');

        if (projectId === 'personal-site') {
          document.body.classList.add('site-case');
          document.querySelector('.project-detail__back').href = 'index.html#projects';
          document.querySelector('.project-detail__error-btn').href = 'index.html#projects';
        }

        if (!projectId) {
          showError();
          return;
        }

        fetch('data/projects.json')
          .then(function (resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.json();
          })
          .then(function (projects) {
            var index = -1;
            var project = null;

            for (var i = 0; i < projects.length; i++) {
              if (projects[i].id === projectId) {
                project = projects[i];
                index = i;
                break;
              }
            }

            if (!project) {
              showError();
              return;
            }

            showContent(project, index);
          })
          .catch(function (err) {
            console.error('project: 加载项目数据失败', err);
            showError();
          });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
